<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Donaira — Generador de ideas para Instagram</title>
<style>
  :root{
    --cream:#f6f1e7;
    --cream-2:#efe7d6;
    --ink:#2f2a22;
    --olive:#4a5236;
    --olive-dark:#333a25;
    --terracotta:#b96a3d;
    --gold:#a9862f;
    --line:#dcd2ba;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    line-height:1.6;
  }
  .wrap{
    max-width:600px;
    margin:0 auto;
    padding:56px 24px 60px;
  }
  header{
    margin-bottom:36px;
  }
  .eyebrow{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    text-transform:uppercase;
    letter-spacing:.14em;
    font-size:11px;
    color:var(--terracotta);
    margin-bottom:10px;
  }
  h1{
    font-size:26px;
    line-height:1.25;
    margin:0 0 10px;
    color:var(--olive-dark);
    font-weight:400;
  }
  .lede{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:14px;
    color:#5a5340;
  }

  .gen-grid{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    gap:16px;
    align-items:center;
    margin-bottom:22px;
  }
  @media (max-width:520px){
    .gen-grid{grid-template-columns:1fr; }
    .gen-x{transform:rotate(90deg); margin:2px auto;}
  }
  .gen-card{
    background:var(--cream-2);
    border:1px solid var(--line);
    border-radius:2px;
    padding:22px 18px;
    text-align:center;
  }
  .gen-pillar{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:8px;
  }
  .gen-word{
    font-size:21px;
    color:var(--olive-dark);
    margin-bottom:4px;
    min-height:26px;
  }
  .gen-cats{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:11px;
    color:#8a8266;
    min-height:14px;
    margin-bottom:14px;
  }
  .gen-x{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color:var(--terracotta);
    font-size:16px;
    text-align:center;
  }
  .gen-refresh{
    width:36px;
    height:36px;
    border-radius:50%;
    border:1px solid var(--olive);
    background:transparent;
    color:var(--olive);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    transition:background .15s ease, color .15s ease;
  }
  .gen-refresh:hover{ background:var(--olive); color:var(--cream); }
  .gen-refresh.spin svg{ animation:gen-spin .5s ease; }
  @keyframes gen-spin{ to{ transform:rotate(180deg); } }
  .gen-refresh svg{width:15px;height:15px;}

  .gen-btn-row{
    text-align:center;
    margin-bottom:34px;
  }
  .gen-shuffle-all{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:12.5px;
    letter-spacing:.04em;
    background:none;
    border:1px solid var(--terracotta);
    color:var(--terracotta);
    padding:9px 20px;
    border-radius:20px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .gen-shuffle-all:hover{ background:var(--terracotta); color:var(--cream); }

  .gen-output{
    border-left:2px solid var(--terracotta);
    background:var(--cream-2);
    padding:20px 22px;
  }
  .gen-output-text{
    font-size:15.5px;
    line-height:1.65;
    white-space:pre-line;
  }
  .gen-output-word{
    color:var(--olive-dark);
  }

  .gen-source{
    margin-top:34px;
    border-top:1px dashed var(--line);
    padding-top:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  .gen-source-status{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:11.5px;
    color:#8a8266;
  }
  .gen-source-actions{
    display:flex;
    gap:14px;
    align-items:center;
  }
  .gen-source-btn{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:11.5px;
    background:none;
    border:none;
    color:var(--olive);
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">La Donaira</div>
    <h1>Generador de ideas para Instagram</h1>
    <p class="lede">Gira las dos ruedas para cruzar dos palabras al azar. Abajo aparecen varias formas de convertir ese cruce en un post.</p>
  </header>

  <div class="gen-grid">
    <div class="gen-card">
      <div class="gen-pillar" id="genPillarA">—</div>
      <div class="gen-word" id="genWordA">—</div>
      <div class="gen-cats" id="genCatsA"></div>
      <button class="gen-refresh" id="genRefreshA" aria-label="Cambiar palabra A" title="Cambiar esta palabra">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
      </button>
    </div>

    <div class="gen-x">×</div>

    <div class="gen-card">
      <div class="gen-pillar" id="genPillarB">—</div>
      <div class="gen-word" id="genWordB">—</div>
      <div class="gen-cats" id="genCatsB"></div>
      <button class="gen-refresh" id="genRefreshB" aria-label="Cambiar palabra B" title="Cambiar esta palabra">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
      </button>
    </div>
  </div>

  <div class="gen-btn-row">
    <button class="gen-shuffle-all" id="genShuffleAll">Girar las dos</button>
  </div>

  <div class="gen-output">
    <div class="gen-output-text" id="genOutputText">—</div>
  </div>

  <div class="gen-source">
    <span class="gen-source-status" id="genSourceStatus">Cargando…</span>
    <div class="gen-source-actions">
      <button class="gen-source-btn" id="genSourceRefresh">Actualizar desde Dropbox</button>
      <button class="gen-source-btn" id="genLocalBtn">Cargar Excel a mano</button>
    </div>
    <input type="file" id="genFileInput" accept=".xlsx,.xls" style="display:none;">
  </div>

</div>

  function buildDefaultWords(){
    return RAW_DEFAULT.map(function(item){
      return { w: item.w, categories: [PILLAR_NAMES[item.p]], h: item.h };
    });
  }

  var WORDS = buildDefaultWords();

  // ---- Text generation: 3 concrete format+content ideas built from both words' hooks ----
  function catsLine(item){
    return (item.categories || []).join(', ');
  }

  // FORMAT_TEMPLATES only ever say "de <palabra>" (bare noun, no article issues) or drop the
  // preposition and use the hook after a colon/parenthesis — keeps the Spanish grammatically safe
  // regardless of whether a given hook happens to start with "el/la/los/las".
  var FORMAT_TEMPLATES = [
    function(a,b){ return 'Carrusel con momentos de ' + a.w + ' y de ' + b.w + ': ' + a.h + ', y también ' + b.h + '.'; },
    function(a,b){ return 'Reel contando el proceso de ' + a.w + ' — ' + a.h + ' — hasta llegar a ' + b.w + '.'; },
    function(a,b){ return 'Story mostrando ' + a.w + ' y ' + b.w + ' en el mismo día, sin explicarlo.'; },
    function(a,b){ return 'Carrusel comparando ' + a.w + ' (' + a.h + ') con ' + b.w + ' (' + b.h + ').'; },
    function(a,b){ return 'Reel corto de ' + a.w + ', usando ' + b.w + ' como cierre — ' + b.h + '.'; },
    function(a,b){ return 'Carrusel de "antes y después" entre ' + a.w + ' y ' + b.w + '.'; }
  ];

  var CLOSER = 'Antes de pensar en grabar algo nuevo, revisá si ya tenés fotos o clips sueltos de estas dos cosas — a veces alcanza con juntar lo que ya existe.';

  function shuffle(arr){
    var out = arr.slice();
    for (var i = out.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = out[i]; out[i] = out[j]; out[j] = tmp;
    }
    return out;
  }

  function generateText(a, b){
    var picks = shuffle(FORMAT_TEMPLATES).slice(0, 3).map(function(fn){ return fn(a, b); });
    return picks.join('\n\n') + '\n\n' + CLOSER;
  }

  // ---- UI wiring ----
  var wordA = null, wordB = null;
  var elWordA = document.getElementById('genWordA');
  var elWordB = document.getElementById('genWordB');
  var elPillarA = document.getElementById('genPillarA');
  var elPillarB = document.getElementById('genPillarB');
  var elCatsA = document.getElementById('genCatsA');
  var elCatsB = document.getElementById('genCatsB');
  var elOutputText = document.getElementById('genOutputText');
  var btnA = document.getElementById('genRefreshA');
  var btnB = document.getElementById('genRefreshB');
  var btnAll = document.getElementById('genShuffleAll');
  var sourceStatus = document.getElementById('genSourceStatus');
  var sourceRefreshBtn = document.getElementById('genSourceRefresh');
  var localBtn = document.getElementById('genLocalBtn');
  var fileInput = document.getElementById('genFileInput');

  function randomWord(exclude){
    var pool = WORDS.filter(function(item){ return !exclude || item.w !== exclude.w; });
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function render(){
    elWordA.textContent = wordA.w;
    elWordB.textContent = wordB.w;
    elPillarA.textContent = wordA.categories[0] || '—';
    elPillarB.textContent = wordB.categories[0] || '—';
    elCatsA.textContent = wordA.categories.length > 1 ? ('también: ' + wordA.categories.slice(1).join(', ')) : '';
    elCatsB.textContent = wordB.categories.length > 1 ? ('también: ' + wordB.categories.slice(1).join(', ')) : '';
    elOutputText.textContent = generateText(wordA, wordB);
  }

  function spin(btn){
    btn.classList.add('spin');
    setTimeout(function(){ btn.classList.remove('spin'); }, 500);
  }

  btnA.addEventListener('click', function(){ wordA = randomWord(wordB); spin(btnA); render(); });
  btnB.addEventListener('click', function(){ wordB = randomWord(wordA); spin(btnB); render(); });
  btnAll.addEventListener('click', function(){
    wordA = randomWord(null); wordB = randomWord(wordA);
    spin(btnA); spin(btnB); render();
  });

  // ---- Loading words: shared parsing (Excel and CSV both funnel through this) ----
  function normHeader(h){
    return (h || '').toString().trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }
  function matchCol(headers, patterns){
    for (var i = 0; i < headers.length; i++){
      var h = normHeader(headers[i]);
      for (var j = 0; j < patterns.length; j++){
        if (patterns[j].test(h)) return i;
      }
    }
    return -1;
  }
  function parseRows(rows){
    if (!rows.length) throw new Error('la hoja está vacía');
    var headers = rows[0];
    var idxWord = matchCol(headers, [/^palabra$/]);
    var idxCat1 = matchCol(headers, [/categoria\s*1/]);
    var idxCat2 = matchCol(headers, [/categoria\s*2/]);
    var idxCat3 = matchCol(headers, [/categoria\s*3/]);
    var idxHook = matchCol(headers, [/gancho/]);
    var idxIncluir = matchCol(headers, [/incluir/]);
    if (idxWord === -1) throw new Error('no encuentro una columna "Palabra"');

    var out = [];
    for (var r = 1; r < rows.length; r++){
      var row = rows[r];
      var word = (row[idxWord] || '').toString().trim();
      if (!word) continue;
      if (idxIncluir !== -1){
        var inc = (row[idxIncluir] || '').toString().trim().toLowerCase();
        if (inc === 'no') continue;
      }
      var cats = [idxCat1, idxCat2, idxCat3]
        .filter(function(i){ return i !== -1; })
        .map(function(i){ return (row[i] || '').toString().trim(); })
        .filter(function(c){ return c.length > 0; });
      if (!cats.length) cats = ['Sin categoría'];
      var hook = idxHook !== -1 ? (row[idxHook] || '').toString().trim() : '';
      if (!hook) hook = word;
      out.push({ w: word, categories: cats, h: hook });
    }
    return out;
  }
  function parseWorkbookBytes(bytes){
    var wb = XLSX.read(bytes, { type: 'array' });
    var sheetName = wb.SheetNames.indexOf('Palabras clave') !== -1 ? 'Palabras clave' : wb.SheetNames[0];
    var rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '' });
    return parseRows(rows);
  }

  function applyWords(parsed, sourceLabel){
    if (parsed.length < 2) throw new Error('encontré menos de 2 palabras usables');
    WORDS = parsed;
    sourceStatus.textContent = parsed.length + ' palabras · ' + sourceLabel;
    wordA = randomWord(null);
    wordB = randomWord(wordA);
    render();
  }

  function loadFromDropbox(){
    sourceStatus.textContent = 'Actualizando desde Dropbox…';
    var url = toDirectDownload(DROPBOX_SHARE_URL);
    fetch(url, { cache: 'no-store' })
      .then(function(res){
        if (!res.ok) throw new Error('respuesta ' + res.status);
        return res.arrayBuffer();
      })
      .then(function(buf){
        var bytes = new Uint8Array(buf);
        var isZip = bytes.length > 1 && bytes[0] === 0x50 && bytes[1] === 0x4B; // 'PK' = xlsx
        var parsed = isZip ? parseWorkbookBytes(bytes) : parseRows(Papa.parse(new TextDecoder('utf-8').decode(bytes), { skipEmptyLines: true }).data);
        applyWords(parsed, 'actualizado desde Dropbox · ' + new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'}));
      })
      .catch(function(err){
        sourceStatus.textContent = 'No pude traer el Excel de Dropbox (' + err.message + '). Usando la lista integrada — probá "Cargar Excel a mano" si tenés el archivo descargado.';
      });
  }

  sourceRefreshBtn.addEventListener('click', loadFromDropbox);
  localBtn.addEventListener('click', function(){ fileInput.click(); });

  fileInput.addEventListener('change', function(e){
    var file = e.target.files[0];
    if (!file) return;
    sourceStatus.textContent = 'Leyendo ' + file.name + '…';
    var reader = new FileReader();
    reader.onload = function(evt){
      try {
        var parsed = parseWorkbookBytes(new Uint8Array(evt.target.result));
        applyWords(parsed, 'cargado desde ' + file.name);
      } catch (err){
        sourceStatus.textContent = 'No pude leer ese archivo (' + err.message + ').';
      }
    };
    reader.onerror = function(){ sourceStatus.textContent = 'No pude leer ese archivo.'; };
    reader.readAsArrayBuffer(file);
  });

  wordA = randomWord(null);
  wordB = randomWord(wordA);
  render();
  loadFromDropbox();
})();
</script>
</body>
</html>
